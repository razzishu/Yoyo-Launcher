android.useAndroidX=true
android.enableJetifier=false

# Gradle 10 and performance readiness
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# Experimental features for Gradle 10 compatibility
# Project isolation is a key requirement for Gradle 10
org.gradle.unsafe.project-isolation=false

# JVM memory settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KSP fixes for cross-drive builds
ksp.incremental=false
